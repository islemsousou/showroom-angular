<app-head-bar></app-head-bar>
<app-search-bar [autos]="autoList" (onSelectCar)="selectCar($event)"></app-search-bar>

@if (selectedCar) {
  <div class="description">
    <img [src]="`images/${selectedCar.photo}`" [alt]="selectedCar.model" />
    <div class="description-text">
      <h2>{{ selectedCar.brand }} {{ selectedCar.model }}</h2>
      <p class="specs">Power : {{ selectedCar.power }} · Price : {{ selectedCar.price }}DNT</p>
      <p>{{ selectedCar.description }}</p>
    </div>
    <button class="close" (click)="closeCar()">✕</button>
  </div>
}
